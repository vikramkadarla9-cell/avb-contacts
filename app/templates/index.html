<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A simple address book for managing contacts and email addresses.">
    <title>Contacts</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  </head>
  <body>
    <main class="app-shell" aria-label="Contacts address book">
      <aside class="contacts-panel">
        <div class="contacts-heading">
          <h1>Contacts</h1>
          <button class="icon-button add-contact-button" id="add-contact" type="button" aria-label="Add contact">
            <span aria-hidden="true"></span>
          </button>
        </div>

        <label class="search-field" for="contact-search">
          <span class="sr-only">Search contacts</span>
          <input id="contact-search" type="search" placeholder="Search contacts" autocomplete="off">
        </label>

        <div id="contact-list-status" class="list-status" role="status">Loading contacts...</div>
        <ul id="contact-list" class="contact-list" aria-label="Contact list"></ul>
        <a class="export-link" href="/api/contacts/export">Export contacts as CSV</a>
      </aside>

      <section class="contact-details" aria-labelledby="form-heading">
        <div class="mobile-detail-header">
          <button id="back-to-contacts" type="button" aria-label="Back to contact list">
            <span aria-hidden="true">‹</span>
            Contacts
          </button>
          <strong id="mobile-contact-title">Contact details</strong>
        </div>

        <div id="welcome-state" class="welcome-state" hidden>
          <h2>No contacts yet</h2>
          <p>Add your first contact to get started.</p>
          <button class="button button-primary" id="empty-add-contact" type="button">Add contact</button>
        </div>

        <form id="contact-form" novalidate hidden>
          <h2 id="form-heading" class="sr-only">Contact details</h2>

          <div id="form-error" class="form-alert" role="alert" hidden></div>

          <div class="contact-tools">
            <button id="toggle-favorite" class="favorite-button" type="button" aria-pressed="false">
              <span class="favorite-star" aria-hidden="true">☆</span>
              <span class="favorite-label">Add to favorites</span>
            </button>
          </div>

          <div class="name-fields">
            <div class="field-group">
              <label for="first-name">First Name</label>
              <input id="first-name" name="first_name" maxlength="80" autocomplete="given-name" required>
              <p class="field-error" id="first-name-error"></p>
            </div>

            <div class="field-group">
              <label for="last-name">Last Name</label>
              <input id="last-name" name="last_name" maxlength="80" autocomplete="family-name" required>
              <p class="field-error" id="last-name-error"></p>
            </div>
          </div>

          <div class="profile-fields">
            <div class="field-group">
              <label for="company">Company</label>
              <input id="company" name="company" maxlength="120" autocomplete="organization">
              <p class="field-error" id="company-error"></p>
            </div>

            <div class="field-group">
              <label for="phone">Phone</label>
              <input id="phone" name="phone" type="tel" maxlength="30" autocomplete="tel" placeholder="513-555-0123">
              <p class="field-error" id="phone-error"></p>
            </div>

            <div class="field-group birthday-field">
              <label for="birthday">Birthday</label>
              <input id="birthday" name="birthday" type="date" autocomplete="bday">
              <p class="field-error" id="birthday-error"></p>
            </div>
          </div>

          <fieldset class="emails-fieldset">
            <legend>Email</legend>
            <div id="email-list" class="email-list"></div>
            <button class="add-email-button" id="add-email" type="button">
              <span class="small-plus" aria-hidden="true"></span>
              <span>add email</span>
            </button>
          </fieldset>

          <div class="form-actions">
            <button class="button button-danger" id="delete-contact" type="button">Delete</button>
            <div class="right-actions">
              <button class="button button-secondary" id="cancel-edit" type="button">Cancel</button>
              <button class="button button-primary" id="save-contact" type="submit">Save</button>
            </div>
          </div>
        </form>
      </section>
    </main>

    <dialog id="delete-dialog" class="confirmation-dialog">
      <form method="dialog">
        <h2>Delete contact?</h2>
        <p>This contact will be removed from the address book. You can undo this right after deleting it.</p>
        <div class="dialog-actions">
          <button class="button button-secondary" value="cancel">Cancel</button>
          <button class="button button-danger" id="confirm-delete" value="confirm">Delete</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <span id="toast-message"></span>
      <button id="toast-action" type="button" hidden></button>
    </div>
  </body>
</html>
